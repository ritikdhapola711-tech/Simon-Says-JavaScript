<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simon Says Game</title>
    <link rel="stylesheet" href="style1.css">
</head>

<body>
    <div class="div2">
        <h1>Simon Says Game</h1>
        <h2>Press any key to start the game</h2>
        <div id="btncontainer">
            <div class="btn red redmagic" id="red">1</div>
            <div class="btn green greenmagic" id="green">2</div>
            <div class="btn yellow yellowmagic" id="yellow">3</div>
            <div class="btn blue bluemagic" id="blue">4</div>
        </div>
    </div>
    <script src="app1.js"></script>
</body>

</html>
